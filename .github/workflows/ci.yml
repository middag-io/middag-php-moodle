name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI uses no private infrastructure and no credentials. This adapter builds on
# the OSS middag-io/* packages (framework, ui) and the michaelmeneses/moodle-stubs
# dev dependency, all resolved from public Composer registries (Packagist).

jobs:
  # Released php-library-check component of middag-io/actions, called by its
  # major tag. One job per PHP version: the static
  # checks (composer validate, strict PSR-4, PHPStan on the canonical stubs,
  # PHP-CS-Fixer and Rector) run on 8.2, the audit and the tests (unit +
  # no-host) on every version.
  php-library-check:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@php-library-check-v1
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4"]'
      audit-blocking-severities: critical, high
      timeout-minutes: 30

  # Specific to this repository, so it stays inline. No composer.lock is
  # committed (library convention): each cell resolves dependencies on its own
  # PHP line. On 8.2/8.3 Composer must land on the Symfony 7.x line (Symfony
  # 8.x requires PHP >= 8.4.1); on 8.4 it may pick Symfony 8.x. Moodle 4.5
  # hosts cap PHP at 8.3, so the 8.3 cell is what proves the lib still installs
  # there; the assertions keep a future constraint drift from silently masking
  # the ^8.2 floor.
  platform:
    name: Platform requirements (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-composer-setup@php-composer-setup-v1
        with:
          php-version: ${{ matrix.php }}

      - name: Assert the resolved vendor satisfies this cell's platform
        run: composer check-platform-reqs

      - name: Assert Symfony resolved on the 7.x line (PHP 8.2/8.3 floor)
        if: matrix.php != '8.4'
        run: |
          composer show symfony/http-foundation | grep -E '^versions +: +\* v?7\.'

  # Specific to this repository, so it stays inline. LB-CI-01: PHPStan against
  # every supported Moodle stubs series (4.5 to 5.3). Blocking: all five series
  # analyse clean at L6, so the per-version class_alias shims (cm_info,
  # modinfo, navigation_node) are backed by matrix evidence.
  #
  # The series tracked here follow `supported` of the consumer plugin, which
  # since local_middag#188 is declared once in its `.moodle-support.json`. The
  # rule from that issue: cover every branch of the range for which
  # moodle-stubs exists. 5.3 exists as v5.3.0.
  stan-matrix:
    name: PHPStan (moodle-stubs ${{ matrix.stubs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stubs: ['~4.5.0', '~5.0.0', '~5.1.0', '~5.2.0', '~5.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-composer-setup@php-composer-setup-v1
        with:
          php-version: '8.2'

      - name: Pin moodle-stubs to the matrix series
        env:
          STUBS: ${{ matrix.stubs }}
        run: composer require --dev "michaelmeneses/moodle-stubs:${STUBS}" --with-all-dependencies --no-interaction

      - name: PHPStan against the matrix stubs
        run: composer check:stan

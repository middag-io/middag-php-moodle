name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI uses no private infrastructure and no credentials. This adapter builds on
# the OSS middag-io/* packages (framework, ui) and the michaelmeneses/moodle-stubs
# dev dependency, all resolved from public Composer registries (Packagist).

jobs:
  # Released php-library-check component of middag-io/actions, called by its
  # major tag. One job per PHP version, with the platform pin (8.3.0) kept: the
  # static checks (composer validate, strict PSR-4, PHPStan on the canonical
  # stubs, PHP-CS-Fixer and Rector) run on 8.3, the floor; the audit and the
  # tests (unit + no-host) on every version. The tool caches live in .cache.
  php-library-check:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@php-library-check-v1
    permissions:
      contents: read
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      tool-cache-paths: .cache
      audit-blocking-severities: critical, high
      timeout-minutes: 30

  # Second call of the same component: removes the platform pin and resolves
  # the highest dependency versions on the PHP of each job, then runs the
  # tests. Symfony 8.x needs PHP 8.4, so the job runs on 8.4 and 8.5 and
  # asserts that every Symfony component this adapter requires resolved to
  # 8.x. The static checks already run in the pinned job.
  php-library-check-highest:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@php-library-check-v1
    permissions:
      contents: read
    with:
      php-versions: '["8.4", "8.5"]'
      dependency-versions: highest
      unset-platform-php: true
      expect-majors: |
        symfony/dependency-injection:8
        symfony/http-client:8
        symfony/http-foundation:8
        symfony/routing:8
      composer-validate: false
      strict-psr: false
      phpstan-script: ""
      cs-fixer-script: ""
      rector-script: ""
      audit-blocking-severities: critical, high
      timeout-minutes: 30

  # Specific to this repository, so it stays inline: PHPStan against the
  # moodle-stubs series of each Moodle version in range. 4.5, 5.1, 5.2 and 5.3
  # are the supported range (upstream support); 5.0 stays as best effort, with
  # no support promise. Blocking: every series analyses clean at L6, so the
  # per-version class_alias shims (cm_info, modinfo, navigation_node) are
  # backed by matrix evidence.
  stan-matrix:
    name: PHPStan (moodle-stubs ${{ matrix.stubs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stubs: ['~4.5.0', '~5.0.0', '~5.1.0', '~5.2.0', '~5.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-composer-setup@php-composer-setup-v1
        with:
          php-version: '8.3'

      - name: Pin moodle-stubs to the matrix series
        env:
          STUBS: ${{ matrix.stubs }}
        run: composer require --dev "michaelmeneses/moodle-stubs:${STUBS}" --with-all-dependencies --no-interaction

      - name: PHPStan against the matrix stubs
        run: composer check:stan
